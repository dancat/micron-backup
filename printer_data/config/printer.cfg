# MOTOR TYPES;
# XY; moons MS14HS5P4150-11
# Z; Oukeda OK42HC40-1684A-XH
# E; Moons CSE14HRA1L410A-01

# preset combined by Sander van Voxel3D_netherlands

# Use at your own risk!!!

#####################################################################
#   Main config
#####################################################################

[include mainsail.cfg]
[include klipperBackupMacros.cfg]
[include shaketune.cfg]
[include macros.cfg]
[include led_effects.cfg]
[include clean_nozzle.cfg]
[include KAMP_Settings.cfg]

[mcu]
#serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_0E002C001951313433343333-if00
canbus_uuid: 71125e28d9de # your UUID of Manta MCU

[mcu EBB42]
canbus_uuid: 632ade7a1074 # your UUID of EBB MCU
#restart_method: command

[mcu cartographer] 
canbus_uuid: 8eaacc94bae0
#restart_method: command # Not needed for probes using CAN. 
##--------------------------------------------------------------------

[printer]
kinematics: corexy
max_velocity: 450  
max_accel: 15000
max_z_velocity: 15
max_z_accel: 350
square_corner_velocity: 12

[input_shaper]
shaper_freq_x: 79.8 # center frequency for the X axis filter
shaper_type_x: mzv # filter type for the X axis
shaper_freq_y: 60 # center frequency for the Y axis filter
shaper_type_y: mzv # filter type for the Y axis
damping_ratio_x: 0.048 # damping ratio for the X axis
damping_ratio_y: 0.042 # damping ratio for the Y axis

[resonance_tester]
probe_points: 90, 90, 20
accel_chip: adxl345

[gcode_arcs]
resolution: 1.0

[exclude_object]

#####################################################################
#   MISC
#####################################################################

#[adxl345] # from EBB42
#cs_pin: EBB42: PB12
#spi_bus: spi2_PB2_PB11_PB10
#axes_map: -y,z,-x

[adxl345]
cs_pin: cartographer:PA0 # For Cartographer V4
spi_bus: spi1

[temperature_sensor MANTA]
sensor_type: temperature_mcu
sensor_mcu: mcu

[temperature_sensor CB1]
sensor_type: temperature_host

[temperature_sensor EBB42_MCU]
sensor_type: temperature_mcu
sensor_mcu: EBB42

[temperature_sensor chamber]
sensor_type: Generic 3950
sensor_pin: PB0 # we use TH1 pin here
min_temp: 0
max_temp: 100
gcode_id: CH

[temperature_sensor cartographer]
sensor_type: temperature_mcu
sensor_mcu: cartographer
min_temp: 5
max_temp: 105

[duplicate_pin_override]
pins: temperature_host,PB0
#   A comma separated list of pins that may be used multiple times in
#   a config file without normal error checks. This parameter must be
#   provided.

#####################################################################
#   X/Y Stepper Settings
#####################################################################

##  B Stepper - Left
##  Connected to MOTOR_1
[stepper_x]
step_pin: PE6
dir_pin: PE5
enable_pin: !PC14
rotation_distance: 32
microsteps: 16
full_steps_per_rotation:200  
position_min: 0
##--------------------------------------------------------------------
position_endstop: 173
position_max: 173
homing_positive_dir: true
endstop_pin: EBB42:PB6 # add this once the x stop story is settled
homing_retract_dist: 3
homing_speed: 65   #Max 100 

# Motor1 MOONS' MS14HS5P4150-11 
[tmc2209 stepper_x]
uart_pin: PC13
interpolate: true
run_current: 0.600

[autotune_tmc stepper_x]
motor: moons-ms14hs5p4150

#####################################################################

##  A Stepper - Right
##  Connected to MOTOR_2
[stepper_y]
step_pin: PE2
dir_pin: PE1
enable_pin: !PE4
rotation_distance: 32
microsteps: 16
full_steps_per_rotation:200 
position_min: 0
##--------------------------------------------------------------------
position_endstop: 190
position_max: 190
homing_positive_dir: true
endstop_pin: ^PF3
homing_retract_dist: 3
homing_speed: 65   #Max 100 

# Motor2 MOONS' MS14HS5P4150-11 
[tmc2209 stepper_y]
uart_pin: PE3
interpolate: true
run_current: 0.600 

[autotune_tmc stepper_y]
motor: moons-ms14hs5p4150
 
#####################################################################
#   Z Stepper Settings
#####################################################################

## Z0 Stepper - Front Left
##  Connected to MOTOR_3
[stepper_z]
step_pin: PB8
dir_pin: PB7
enable_pin: !PE0
rotation_distance: 32
gear_ratio: 64:16
microsteps: 16
full_steps_per_rotation:200
endstop_pin: probe:z_virtual_endstop
##--------------------------------------------------------------------
position_max: 165
position_min: -5
homing_speed: 8
second_homing_speed: 3
homing_retract_dist: 0

# Motor3 moons MS17HD2P4150
[tmc2209 stepper_z]
uart_pin: PB9
interpolate: true
run_current: 0.45
stealthchop_threshold: 999999

[autotune_tmc stepper_z]
motor: moons-ms17hd2p4150


#####################################################################

##  Z1 Stepper - Rear Left
##  Connected to MOTOR_4 
[stepper_z1]
step_pin: PB4
dir_pin: !PB3
enable_pin: !PB6
rotation_distance: 32
gear_ratio: 64:16
microsteps: 16
full_steps_per_rotation:200

# moons MS17HD2P4150
[tmc2209 stepper_z1]
uart_pin: PB5
interpolate: true
run_current: 0.45
stealthchop_threshold: 999999

[autotune_tmc stepper_z1]
motor: moons-ms17hd2p4150


#####################################################################

##  Z2 Stepper - Rear Right
##  Connected to MOTOR_5
[stepper_z2]
step_pin: PG13
dir_pin: PG12
enable_pin: !PG15
rotation_distance: 32
gear_ratio: 64:16
microsteps: 16
full_steps_per_rotation:200

# moons MS17HD2P4150
[tmc2209 stepper_z2]
uart_pin: PG14
interpolate: true
run_current: 0.45
stealthchop_threshold: 999999

[autotune_tmc stepper_z2]
motor: moons-ms17hd2p4150


#####################################################################

##  Z3 Stepper - Front Right
##  Connected to MOTOR_6
[stepper_z3]
step_pin: PG9
dir_pin: !PD7
enable_pin: !PG11 
rotation_distance: 32
gear_ratio: 64:16
microsteps: 16
full_steps_per_rotation:200

# moons MS17HD2P4150
[tmc2209 stepper_z3]
uart_pin: PG10
interpolate: true
run_current: 0.45
stealthchop_threshold: 999999

[autotune_tmc stepper_z3]
motor: moons-ms17hd2p4150


#####################################################################
#   Extruder
#####################################################################

##  Connected to EBB canbus board
[extruder]
step_pin: EBB42: PD0
dir_pin: EBB42: PD1
enable_pin: !EBB42: PD2
rotation_distance: 5.64186   # Suggested to tune yourself
# gear_ratio: 50:10 # not needed for LGX Lite
microsteps: 32
full_steps_per_rotation: 200
filament_diameter: 1.750
max_extrude_only_velocity: 120
max_extrude_only_accel: 800
nozzle_diameter: 0.400
heater_pin: EBB42: PB13
max_extrude_cross_section: 15
max_extrude_only_distance: 101
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: EBB42: PA3
min_temp: 10
max_temp: 290
max_power: 1.0
min_extrude_temp: 170
#control = pid      # Suggested to tune yourself
#pid_kp = 26.679
#pid_ki = 1.533
#pid_kd = 116.055
pressure_advance: 0.0175     # Suggested to tune yourself
pressure_advance_smooth_time: 0.040

##  E0 on EBB42 can moons CSE14HRA1L410A-01
[tmc2209 extruder]
uart_pin: EBB42: PA15
interpolate: true
run_current: 0.500
stealthchop_threshold: 999999

[autotune_tmc extruder]
motor: moons-cse14hra1l410a


#####################################################################
#   Bed Heater
#####################################################################

[heater_bed]
heater_pin: PA0 # HE0
sensor_type: Generic 3950
sensor_pin: PB1
max_power: 0.6
min_temp: 0
max_temp: 120

#####################################################################
#   Fan Control
#####################################################################

[fan]
##  Print Cooling Fan - FAN0
pin: EBB42: PA1
kick_start_time: 0.5
off_below: 0.10

[heater_fan hotend_fan]
pin: EBB42: PA0
heater: extruder
heater_temp: 50.0

[temperature_fan CB1_fan]
##  Controller fan - FAN3
pin: PF8
sensor_type: temperature_host
min_temp: 10
max_temp: 80
target_temp: 60
control: pid # or watermark
pid_Kp: 2.0
pid_Ki: 5.0
pid_Kd: 0.5
pid_deriv_time: 2.0
min_speed: 0.0
max_speed: 1.0

[controller_fan z_stepper_fan]
##  Controller fan - FAN2
pin: PF6   # Replace with the actual pin your fan is connected to
max_power: 1.0
kick_start_time: 0.5
stepper: stepper_z, stepper_z1, stepper_z2, stepper_z3 # Add all your Z stepper motors here
heater: extruder
idle_timeout: 60
idle_speed: 0.5

#################
# Carbon Filter #
#################

[fan_generic filter]
pin: PF7 # VF0

[delayed_gcode filter_off]
gcode:
    SET_FAN_SPEED FAN=filter SPEED=0

[gcode_macro TOGGLE_FILTER]
gcode:
    {% if printer['fan_generic filter'].speed > 0 %}
      SET_FAN_SPEED FAN=filter SPEED=0
    {% else %}
      SET_FAN_SPEED FAN=filter SPEED=1
    {% endif %}

#################
# Fan under bed #
#################

[fan_generic bed_fan]
pin: PF9 # VF1

[delayed_gcode bed_fan_off]
gcode:
    SET_FAN_SPEED FAN=filter SPEED=0

[gcode_macro TOGGLE_BED_FAN]
gcode:
    {% if printer['fan_generic bed_fan'].speed > 0 %}
      SET_FAN_SPEED FAN=bed_fan SPEED=0
    {% else %}
      SET_FAN_SPEED FAN=bed_fan SPEED=1
    {% endif %}


#############
# 	Probe
#############
# [include klicky.cfg] 
#[probe]
#pin: EBB42:PB9 
#x_offset: 0
#y_offset: 25.5
#speed: 20
#lift_speed:5
#samples: 2
#samples_tolerance: 0.05
#samples_tolerance_retries: 3
#z_offset = 6.006 # for PEI with normal nozzle
#z_offset = 6.294 # for PEI textured with hard nozzle

[cartographer]
mcu: cartographer
x_offset: 0 # This is the offset of your probe from the nozzle tip, to the centre of the coil.
y_offset: 25 # This is the offset of your probe from the nozzle tip, to the centre of the coil.
verbose: no # For extra output

[safe_z_home]
home_xy_position: 86.5,90
z_hop: 10

#[bed_mesh] for klicky
#speed: 120
#horizontal_move_z: 10
#mesh_min: 13,27.5
#mesh_max: 160,140
#probe_count: 7,7
#algorithm: bicubic
#fade_start: 1.0
#fade_end: 10
#mesh_pps: 2,2
#adaptive_margin: 5

[bed_mesh]
zero_reference_position: 86.5, 90 # The centre of your bed. 
speed: 300
horizontal_move_z: 3
mesh_min: 15,26 # The first probed coordinate, nearest to the origin. This coordinate is relative to the probe's location.
mesh_max: 170,170 # The probed coordinate farthest from the origin. This is not necessarily the last point probed, as the probing process occurs in a zig-zag fashion. As with mesh_min, this coordinate is relative to the probe's location.
probe_count: 20, 20
adaptive_margin: 10
mesh_pps: 0,0 # Disable interpolation - mesh is probably dense enough


[quad_gantry_level]
speed: 100
horizontal_move_z: 8
retries: 6
retry_tolerance: 0.0075
max_adjust: 10
gantry_corners:
   -60.2,-10.4
   244.1,234.5
#  Probe points
points:
  13,1
  13,140
  160,140
  160,1

#####################################################################
#   Homing and Gantry Adjustment Routines
#####################################################################

[idle_timeout]
timeout: 1800

########################################
# EXP1 / EXP2 (display) pins
########################################

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PE7, EXP1_2=PG1,
    EXP1_3=PG0, EXP1_4=PF15,
    EXP1_5=PF14, EXP1_6=PF13,    # Slot in the socket on this side
    EXP1_7=PF12, EXP1_8=PF11,
    EXP1_9=<GND>, EXP1_10=<5V>,

    # EXP2 header
    EXP2_1=PE13, EXP2_2=PE12,
    EXP2_3=PE15, EXP2_4=PE11,
    EXP2_5=PE10, EXP2_6=PE14,      # Slot in the socket on this side
    EXP2_7=PE8, EXP2_8=<RST>,
    EXP2_9=<GND>, EXP2_10=<NC>

